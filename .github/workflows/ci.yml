name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw was created on Windows and may not be marked executable on Linux.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # No API key is needed: tests use the mock LLM.
      - name: Build and test
        run: ./mvnw -B verify
