spring.application.name=aegis-backend

# The Gemini starter refuses to start without an API key, even when we only
# use the mock LLM. So: use the GEMINI_API_KEY environment variable if it is
# set, otherwise a harmless placeholder that lets tests and CI start.
# NEVER put a real key in this file.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:placeholder-key-for-build-only}
