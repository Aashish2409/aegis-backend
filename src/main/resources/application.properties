spring.application.name=aegis-backend
# Name of the application
spring.application.name=aegis-backend

# Gemini API key.
# Reads the GEMINI_API_KEY environment variable if it is set.
# If it is not set, a harmless placeholder is used so the app (and the
# tests / CI build) can still start. The placeholder will NOT work for
# real LLM calls, which is fine until we switch to the "live" profile.
# NEVER put a real key in this file.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:placeholder-key-for-build-only}